<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodExpress - Login</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">

        <a href="index.html" class="logo">FoodExpress</a>

        <div class="auth-tabs">
            <button id="loginTab" class="active" onclick="showLogin()">
                Login
            </button>
            <button id="registerTab" onclick="showRegister()">
                Register
            </button>
        </div>

        <!-- Login -->
        <form id="loginForm" class="auth-form">
            <h1>Welcome back</h1>
            <p class="subtitle">Login to your FoodExpress account</p>

            <label for="loginUsername">Username</label>
            <input
                type="text"
                id="loginUsername"
                placeholder="Enter your username"
                required
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <div id="loginMessage" class="message"></div>

            <button type="submit" class="submit-button">
                Login
            </button>
        </form>

        <!-- Register -->
        <form id="registerForm" class="auth-form hidden">
            <h1>Create account</h1>
            <p class="subtitle">Join FoodExpress</p>

            <label for="registerName">Name</label>
            <input
                type="text"
                id="registerName"
                placeholder="Enter your name"
            >

            <label for="registerUsername">Username</label>
            <input
                type="text"
                id="registerUsername"
                placeholder="Choose a username"
                required
            >

            <label for="registerEmail">Email</label>
            <input
                type="email"
                id="registerEmail"
                placeholder="Enter your email"
                required
            >

            <label for="registerPassword">Password</label>
            <input
                type="password"
                id="registerPassword"
                placeholder="At least 6 characters"
                required
            >

            <div id="registerMessage" class="message"></div>

            <button type="submit" class="submit-button">
                Create account
            </button>
        </form>

        <a href="index.html" class="back-link">
            ← Back to FoodExpress
        </a>

    </div>
</div>

<script src="js/auth.js"></script>

</body>
</html>
