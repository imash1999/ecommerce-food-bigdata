<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart - FoodExpress</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cart.css">
</head>

<body>

<header class="topbar">
    <div class="topbar-inner">

        <a href="/" class="logo">
            <img class="logo-icon" src="images/icons/logo.svg" alt="" width="30" height="30">
            <span>FoodExpress</span>
        </a>

        <div class="location">
            <span>📍</span>
            <span>Birmingham, AL</span>
        </div>

        <nav class="nav">

            <a href="index.html" class="nav-link">
                Restaurants
            </a>

            <a href="cart.html" class="nav-link cart-link">
                Cart
                <span id="cartCount">0</span>
            </a>

            <a href="#" class="login-button">
                Sign in
            </a>

        </nav>

    </div>
</header>


<main class="cart-page">

    <div class="cart-header">

        <div>
            <p class="section-eyebrow">
                YOUR ORDER
            </p>

            <h1>Your Cart</h1>
        </div>

        <a href="index.html" class="back-link">
            ← Continue shopping
        </a>

    </div>


    <div
        id="emptyCart"
        class="empty-cart"
        style="display: none;"
    >

        <div class="empty-cart-icon">
            🛒
        </div>

        <h2>Your cart is empty</h2>

        <p>
            Add some delicious food from a restaurant.
        </p>

        <a
            href="index.html"
            class="primary-button"
        >
            Browse restaurants
        </a>

    </div>


    <div
        id="cartContent"
        class="cart-layout"
        style="display: none;"
    >

        <section>

            <div
                id="cartItems"
                class="cart-items"
            >
            </div>

        </section>


        <aside class="order-summary">

            <h2>Order summary</h2>

            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotal">
                    $0.00
                </strong>
            </div>

            <div class="summary-row">
                <span>Delivery fee</span>
                <strong id="deliveryFee">
                    $0.00
                </strong>
            </div>

            <div class="summary-divider"></div>

            <div class="summary-total">
                <span>Total</span>
                <strong id="total">
                    $0.00
                </strong>
            </div>

            <button onclick="checkout()">
                Proceed to checkout
            </button>

        </aside>

    </div>

</main>


<script src="js/cart.js"></script>

</body>
</html>
